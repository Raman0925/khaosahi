name: Screenshots

# Builds the app, walks every main screen on an emulator in English and Hindi, and uploads the PNGs.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.maestro-screens/**'
      - 'scripts/screenshots-ci.sh'
      - '.github/workflows/screenshots.yml'

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Build APK (x86_64, debug-signed release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - name: Build release APK signed with the public debug key (for emulators only)
        working-directory: android
        env:
          KHAOSAHI_UPLOAD_STORE_FILE: ${{ github.workspace }}/android/app/debug.keystore
          KHAOSAHI_UPLOAD_STORE_PASSWORD: android
          KHAOSAHI_UPLOAD_KEY_ALIAS: androiddebugkey
          KHAOSAHI_UPLOAD_KEY_PASSWORD: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 3

  screenshots:
    name: Take screenshots (Pixel 6, Android 16)
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: screenshots-apk
          path: apk
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run the screenshot tour
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/screenshots-ci.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: |
            screenshots/
            maestro-out-en/
            maestro-out-hi/
            ~/.maestro/tests/
          retention-days: 30
