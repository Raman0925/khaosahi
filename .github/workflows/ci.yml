name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, content
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run validate-content
      - name: Release content gate (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run validate-content:release

  android:
    name: Android release build
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci

      - name: Write release config and upload key (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_NATIVE_ID: ${{ secrets.ADMOB_NATIVE_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_APP_OPEN_ID: ${{ secrets.ADMOB_APP_OPEN_ID }}
          PRIVACY_POLICY_URL: ${{ secrets.PRIVACY_POLICY_URL }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          {
            echo "ADMOB_APP_ID=$ADMOB_APP_ID"
            echo "ADMOB_BANNER_ID=$ADMOB_BANNER_ID"
            echo "ADMOB_NATIVE_ID=$ADMOB_NATIVE_ID"
            echo "ADMOB_INTERSTITIAL_ID=$ADMOB_INTERSTITIAL_ID"
            echo "ADMOB_REWARDED_ID=$ADMOB_REWARDED_ID"
            echo "ADMOB_APP_OPEN_ID=$ADMOB_APP_OPEN_ID"
            echo "PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL"
          } > .env
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          echo "KHAOSAHI_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Build AAB (unsigned unless tagged)
        working-directory: android
        env:
          KHAOSAHI_UPLOAD_STORE_PASSWORD: ${{ secrets.KHAOSAHI_UPLOAD_STORE_PASSWORD }}
          KHAOSAHI_UPLOAD_KEY_ALIAS: ${{ secrets.KHAOSAHI_UPLOAD_KEY_ALIAS }}
          KHAOSAHI_UPLOAD_KEY_PASSWORD: ${{ secrets.KHAOSAHI_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}
