<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs><radialGradient id="bg" cx="30%" cy="20%" r="95%"><stop offset="0" stop-color="#2FA36B"/><stop offset=".55" stop-color="#1B6B4A"/><stop offset="1" stop-color="#114A33"/></radialGradient></defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <defs>
    <linearGradient id="leafA" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7BD389"/><stop offset="1" stop-color="#C9F27B"/>
    </linearGradient>
    <linearGradient id="leafB" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5CBF72"/><stop offset="1" stop-color="#A6E58A"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6F2EC"/>
    </linearGradient>
  </defs>
  <!-- big leaf, leaning right -->
  <path d="M262 262 C 250 196, 282 140, 352 120 C 362 190, 330 246, 262 262 Z" fill="url(#leafA)"/>
  <path d="M266 252 C 290 210, 314 170, 344 134" fill="none" stroke="#2F8A55" stroke-width="7" stroke-linecap="round" opacity=".55"/>
  <!-- small leaf, leaning left -->
  <path d="M248 264 C 252 214, 222 176, 168 166 C 160 218, 190 256, 248 264 Z" fill="url(#leafB)"/>
  <path d="M244 256 C 226 228, 206 204, 178 178" fill="none" stroke="#2F8A55" stroke-width="6" stroke-linecap="round" opacity=".5"/>
  <!-- bowl (katori) -->
  <path d="M118 262 H394 C 394 336, 334 384, 256 384 C 178 384, 118 336, 118 262 Z" fill="url(#bowl)"/>
  <rect x="110" y="250" width="292" height="26" rx="13" fill="#FFFFFF"/>
  <rect x="134" y="292" width="244" height="12" rx="6" fill="#F4A53C"/>
  <rect x="212" y="380" width="88" height="18" rx="9" fill="#E6F2EC"/>
</svg>
