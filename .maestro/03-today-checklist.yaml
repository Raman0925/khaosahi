# F3: tick the first checklist item on Today; it becomes checked and the count updates.
appId: in.khaosahi.app
name: 03-today-checklist
tags: [smoke]
---
- runFlow: subflows/onboard.yaml
- scrollUntilVisible:
    element: '0 of [0-9]+ done'
    direction: DOWN
- tapOn:
    id: 'checklist-item-.*'
    index: 0
- assertVisible: '1 of [0-9]+ done'
- takeScreenshot: 03-checklist
