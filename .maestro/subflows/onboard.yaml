# Reusable: fresh install -> onboarding -> Today (selectors are real testIDs).
# Profile: both conditions, male, 45 y, 168 cm, 78 kg, waist 92 cm, vegetarian, north.
appId: app.khaosahi
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'onboarding-language'
    timeout: 30000
- tapOn:
    id: 'language-en'
- tapOn:
    id: 'onboarding-next'
# Intro
- tapOn:
    id: 'intro-skip'
# Disclaimer
- assertVisible: 'KhaoSahi gives general diet and lifestyle information.*'
- tapOn:
    id: 'disclaimer-ack'
- tapOn:
    id: 'onboarding-next'
# Consent
- scrollUntilVisible:
    element:
      id: 'consent-agree'
    direction: DOWN
- tapOn:
    id: 'consent-agree'
# Age gate
- tapOn:
    id: 'age-yes'
# Profile
- extendedWaitUntil:
    visible:
      id: 'profile-setup'
    timeout: 10000
- tapOn:
    id: 'condition-both'
- tapOn:
    id: 'field-ageYears'
- inputText: '45'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'sex-male'
    direction: DOWN
- tapOn:
    id: 'sex-male'
- scrollUntilVisible:
    element:
      id: 'field-height'
    direction: DOWN
- tapOn:
    id: 'field-height'
- inputText: '168'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'field-waist'
    direction: DOWN
- tapOn:
    id: 'field-waist'
- inputText: '92'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'field-weight'
    direction: DOWN
- tapOn:
    id: 'field-weight'
- inputText: '78'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'diet-veg'
    direction: DOWN
- tapOn:
    id: 'diet-veg'
- scrollUntilVisible:
    element:
      id: 'region-north'
    direction: DOWN
- tapOn:
    id: 'region-north'
- scrollUntilVisible:
    element:
      id: 'profile-submit'
    direction: DOWN
- tapOn:
    id: 'profile-submit'
# Today
- extendedWaitUntil:
    visible:
      id: 'today-screen'
    timeout: 15000
