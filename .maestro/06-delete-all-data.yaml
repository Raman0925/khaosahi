# F9: delete all data -> confirm -> back to the language screen.
appId: app.khaosahi
name: 06-delete-all-data
tags: [smoke]
---
- runFlow: subflows/onboard.yaml
- tapOn:
    id: 'open-settings'
- scrollUntilVisible:
    element:
      id: 'settings-delete'
    direction: DOWN
- tapOn:
    id: 'settings-delete'
- tapOn: '(?i)Delete everything'
- extendedWaitUntil:
    visible:
      id: 'onboarding-language'
    timeout: 15000
