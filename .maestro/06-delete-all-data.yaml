# Settings: delete all data -> confirm -> back to the onboarding language screen.
#
# Selector assumptions:
# - Settings opens from the header button with testID "open-settings".
# - The Settings screen has a "Delete all data" row near the bottom.
# - A confirmation dialog appears with a destructive "Delete" button (common.delete).
# - After wiping, the app shows the first onboarding screen with "English" and "हिन्दी".
appId: app.khaosahi
name: 06-delete-all-data
tags:
  - smoke
---
- runFlow: subflows/onboard.yaml
- tapOn:
    id: 'open-settings'
- scrollUntilVisible:
    element: '(?i)Delete all data'
    direction: DOWN
- tapOn: '(?i)Delete all data'
- tapOn: 'Delete|DELETE|Delete all'
- extendedWaitUntil:
    visible: 'हिन्दी'
    timeout: 10000
- assertVisible: 'English'
- assertNotVisible: 'Today'

# Data really is gone: relaunching still shows onboarding
- stopApp
- launchApp
- extendedWaitUntil:
    visible: 'हिन्दी'
    timeout: 10000
