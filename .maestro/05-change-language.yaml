# F9: switch to Hindi in Settings; the UI changes without a restart.
appId: app.khaosahi
name: 05-change-language
tags: [smoke]
---
- runFlow: subflows/onboard.yaml
- tapOn:
    id: 'open-settings'
- scrollUntilVisible:
    element: 'हिन्दी'
    direction: DOWN
- tapOn: 'हिन्दी'
- back
- assertVisible: 'आज'
- takeScreenshot: 05-hindi
