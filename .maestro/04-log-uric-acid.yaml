# F6: log a uric acid value and see it on the metric screen.
appId: app.khaosahi
name: 04-log-uric-acid
tags: [smoke]
---
- runFlow: subflows/onboard.yaml
- tapOn: 'Progress'
- scrollUntilVisible:
    element:
      id: 'progress-add-uricAcid'
    direction: DOWN
- tapOn:
    id: 'progress-add-uricAcid'
- scrollUntilVisible:
    element:
      id: 'progress-entry-value'
    direction: DOWN
- tapOn:
    id: 'progress-entry-value'
- inputText: '6.8'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'progress-entry-save'
    direction: DOWN
- tapOn:
    id: 'progress-entry-save'
- scrollUntilVisible:
    element:
      id: 'progress-card-uricAcid'
    direction: DOWN
- assertVisible: '.*6\.8.*'
- takeScreenshot: 04-progress
