# F4: search "rajma" (Latin) and "राजमा" (Devanagari), open the detail screen.
appId: app.khaosahi
name: 02-food-search
tags: [smoke]
---
- runFlow: subflows/onboard.yaml
- tapOn: 'Food'
- tapOn:
    id: 'food-search'
- inputText: 'rajma'
- hideKeyboard
- tapOn:
    id: 'food-row-rajma'
- assertVisible:
    id: 'food-detail-screen'
- assertVisible:
    id: 'food-rating-uricAcid'
- takeScreenshot: 02-food-detail
- back
- tapOn:
    id: 'food-search'
- eraseText: 20
- inputText: 'राजमा'
- hideKeyboard
- assertVisible:
    id: 'food-row-rajma'
