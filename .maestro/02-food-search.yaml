# F4: search "rajma" (Latin) and "राजमा" (Devanagari), open the detail screen.
appId: in.khaosahi.app
name: 02-food-search
tags: [smoke]
---
- runFlow: subflows/onboard.yaml
- tapOn: 'Food'
- tapOn:
    id: 'food-search'
- inputText: 'rajma'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'food-row-rajma'
    direction: DOWN
- tapOn:
    id: 'food-row-rajma'
- assertVisible:
    id: 'food-detail-screen'
- scrollUntilVisible:
    element:
      id: 'food-rating-uricAcid'
    direction: DOWN
- assertVisible:
    id: 'food-rating-uricAcid'
- takeScreenshot: 02-food-detail
- back
- tapOn:
    id: 'food-search'
- eraseText: 20
- inputText: 'राजमा'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'food-row-rajma'
    direction: DOWN
